<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exercício 06 - Agenda de Contatos</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="cabecalho">
            <h1>☎️ Minha Agenda de Contatos</h1>
            <p>Organize seus contatos de forma simples e prática</p>
        </div>
        <div class="conteudo">
            <div class="formulario">
                <h2>➕ Adicionar Novo Contato</h2>
                <input id="nome-contato" type="text" placeholder="Digite o nome completo">
                <input id="email-contato" type="email" placeholder="Digite o email">
                <input id="telefone-contato" type="text" placeholder="Digite o telefone">

                <button id="botao-add-contato">Adicionar Contato</button>

            </div>
            <div class="tabela">
                <h2>📝 Lista de Contatos</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Telefone</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>John</td>
                            <td>ectoBiologist@sburb.skaia.com</td>
                            <td>413612</td>
                        </tr>
                        <tr>
                            <td>Karkat</td>
                            <td>carcinoGeneticist@sgrub.skaia.com</td>
                            <td>6121025</td>
                        </tr>
                        
                    </tbody>
                </table>
            </div>
        </div>
        <div class="rodape">
            <p>&copy; 2026 Minha Agenda | Deivid</p>
        </div>


    </body>
</html>
